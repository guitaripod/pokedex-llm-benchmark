<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pokédex Ultra — Every Pokémon, One Database</title>
  <meta name="description" content="The definitive Pokédex. All 1025 Pokémon with stats, abilities, evolutions, moves, type matchups and more — powered by PokeAPI, served at the edge." />
  <meta name="theme-color" content="#0a0d16" />
  <meta property="og:title" content="Pokédex Ultra" />
  <meta property="og:description" content="All 1025 Pokémon. Stats, abilities, evolutions, moves, matchups and more." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23ef4444'/%3E%3Cpath d='M1 12h9a2 2 0 0 1 4 0h9' fill='%23fff'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%23fff'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%230a0d16'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"><div class="glow glow-a"></div><div class="glow glow-b"></div></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="Pokédex Ultra home">
        <span class="logo-ball"><span class="logo-ball-inner"></span></span>
        <span class="logo-text">Pokédex <em>Ultra</em></span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search name, number, type, ability…" autocomplete="off" spellcheck="false" />
        <kbd class="search-kbd">/</kbd>
        <button id="search-clear" class="icon-btn search-clear" aria-label="Clear search" hidden>&times;</button>
      </div>

      <div class="top-actions">
        <button id="random-btn" class="btn btn-ghost" title="Surprise me">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 10.5h-6.5L13 2z"/></svg>
          Random
        </button>
        <button id="collection-btn" class="btn btn-ghost" title="Your collection">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.7-9.7-9C.9 8.6 2.6 5 6 5c2 0 3.4 1.2 4.2 2.4h1.6C12.6 6.2 14 5 16 5c3.4 0 5.1 3.6 3.7 7-2.2 4.3-9.7 9-9.7 9z"/></svg>
          <span id="collection-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="filters-wrap">
    <div class="filters-inner">
      <div class="chip-row" id="type-filter" role="group" aria-label="Filter by type"></div>
      <div class="filter-row">
        <select id="gen-filter" class="select" aria-label="Filter by generation">
          <option value="all">All generations</option>
        </select>
        <select id="sort-select" class="select" aria-label="Sort">
          <option value="id">Sort: National №</option>
          <option value="name">Sort: Name A–Z</option>
          <option value="statTotal">Sort: Base stat total</option>
          <option value="height">Sort: Height</option>
          <option value="weight">Sort: Weight</option>
        </select>
        <select id="special-filter" class="select" aria-label="Rarity filter">
          <option value="all">Any rarity</option>
          <option value="legendary">Legendary</option>
          <option value="mythical">Mythical</option>
          <option value="regular">Regular</option>
          <option value="caught">Caught only</option>
          <option value="uncaught">Not caught yet</option>
        </select>
        <span id="result-count" class="result-count">—</span>
        <button id="reset-filters" class="btn btn-ghost btn-sm" hidden>Reset</button>
      </div>
    </div>
  </div>

  <main id="grid" class="grid" aria-label="Pokémon list"></main>
  <div id="sentinel" class="sentinel" aria-hidden="true"></div>

  <div id="progress-card" class="progress-card" hidden>
    <div class="progress-head">
      <span id="progress-label">Collection</span>
      <span id="progress-text">0 / 1025</span>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  </div>

  <footer class="footer">
    <p>All data from <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> · Sprites &amp; artwork © Nintendo / GAME FREAK · Built with Cloudflare Workers &amp; KV</p>
  </footer>

  <div id="detail-root"></div>
  <div id="compare-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="ability-pop" class="ability-pop" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
